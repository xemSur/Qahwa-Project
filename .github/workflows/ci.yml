name: Qahwa Project CI

on:
  push:
  pull_request:

jobs:
  build:
    name: Build React application
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm install
      - name: Build application
        run: npm run build
